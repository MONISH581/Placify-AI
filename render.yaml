# Render Blueprint configuration for Placify-AI
# https://render.com/docs/blueprint-spec

services:
  # Web App + API (Node.js Express + React SPA + SQLite)
  - type: web
    name: placify-ai
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run build:render
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        value: file:./dev.db
      - key: JWT_SECRET
        generateValue: true
      - key: INTERNAL_API_KEY
        generateValue: true
      # 'local' runs JS and Python via sandbox child processes.
      # Or leave empty / set 'disabled' or 'judge0' (with JUDGE0_API_URL).
      - key: CODE_RUNNER
        value: local
      - key: ALLOWED_ORIGINS
        value: "*"
      # Set to "true" to seed student & admin demo accounts on deploy
      - key: SEED_DEMO_DATA
        value: "true"
      # Optional Gemini API key for AI mentor, reviews, and resume analysis
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      # Optional Judge0 integration
      - key: JUDGE0_API_URL
        sync: false
      - key: JUDGE0_API_KEY
        sync: false
      - key: JUDGE0_API_HOST
        sync: false
      # Optional: connect to external ML microservice if deployed
      - key: ML_SERVICE_URL
        sync: false

  # OPTIONAL: ML Microservice (FastAPI + PyTorch + Scikit-learn + FAISS)
  # NOTE: The ML service requires >= 1 GB RAM (Render Starter plan or above)
  # because PyTorch and embeddings require more memory than the Free tier's 512 MB.
  # If you have a paid Render plan, uncomment the service below:
  #
  # - type: web
  #   name: placify-ml
  #   runtime: python
  #   plan: starter
  #   region: oregon
  #   rootDir: ml_service
