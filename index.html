<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Placify - placement preparation platform with a coding arena, learning tracks, mock interviews, resume analysis and ML-based readiness insights."
    />
    <meta name="theme-color" content="#050505" />
    <link rel="icon" href="data:," />
    <script>
      document.documentElement.setAttribute('data-theme', 'dark');
      try {
        if (localStorage.getItem('placify-theme') === 'light') document.documentElement.removeAttribute('data-theme');
      } catch (e) {}
    </script>
    <script>
      try {
        if (localStorage.getItem('placify-theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
      } catch (e) {}
    </script>
    <title>Placify - Placement Preparation Platform</title>
  </head>
  <body>
    <noscript>Placify needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
